components:
  schemas:
    Hall:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        rows_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        cols_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        dolby_atmos:
          type: boolean
      required:
      - cols_count
      - dolby_atmos
      - id
      - name
      - rows_count
    Movie:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        description:
          type: string
        producer:
          type: string
          maxLength: 100
        release_date:
          type: string
          format: date
        duration:
          type: string
        rating:
          type: string
          maxLength: 10
        poster_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        genres:
          type: string
          maxLength: 200
        is_active:
          type: boolean
      required:
      - description
      - duration
      - id
      - producer
      - rating
      - release_date
      - title
    PatchedHall:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        rows_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        cols_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        dolby_atmos:
          type: boolean
    PatchedMovie:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        description:
          type: string
        producer:
          type: string
          maxLength: 100
        release_date:
          type: string
          format: date
        duration:
          type: string
        rating:
          type: string
          maxLength: 10
        poster_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        genres:
          type: string
          maxLength: 200
        is_active:
          type: boolean
    PatchedScreening:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        movie_title:
          type: string
          readOnly: true
        hall_name:
          type: string
          readOnly: true
        start_time:
          type: string
          format: date-time
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        movie:
          type: integer
        hall:
          type: integer
    PatchedSeat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        row_label:
          type: string
          maxLength: 7
        seat_number:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        grid_x:
          type: integer
          maximum: 2147483647
          minimum: 0
        grid_y:
          type: integer
          maximum: 2147483647
          minimum: 0
        seat_type:
          $ref: '#/components/schemas/SeatTypeEnum'
        hall:
          type: integer
    PatchedTicket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        price_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        client:
          type: integer
        screening:
          type: integer
        seat:
          type: integer
    Screening:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        movie_title:
          type: string
          readOnly: true
        hall_name:
          type: string
          readOnly: true
        start_time:
          type: string
          format: date-time
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        movie:
          type: integer
        hall:
          type: integer
      required:
      - hall
      - hall_name
      - id
      - movie
      - movie_title
      - start_time
    Seat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        row_label:
          type: string
          maxLength: 7
        seat_number:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        grid_x:
          type: integer
          maximum: 2147483647
          minimum: 0
        grid_y:
          type: integer
          maximum: 2147483647
          minimum: 0
        seat_type:
          $ref: '#/components/schemas/SeatTypeEnum'
        hall:
          type: integer
      required:
      - grid_x
      - grid_y
      - hall
      - id
      - row_label
      - seat_number
    SeatTypeEnum:
      enum:
      - REGULAR
      - VIP
      type: string
      description: |-
        * `REGULAR` - Regular
        * `VIP` - VIP
    StatusEnum:
      enum:
      - RESERVED
      - PAID
      - CANCELLED
      type: string
      description: |-
        * `RESERVED` - Reserved
        * `PAID` - Paid
        * `CANCELLED` - Cancelled
    Ticket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        price_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        client:
          type: integer
        screening:
          type: integer
        seat:
          type: integer
      required:
      - created_at
      - id
      - price_paid
      - screening
      - seat
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
